services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - PG_URL=postgres://clinic:clinic123@db:5432/clinic
    volumes:
      - ./data.db:/app/data.db
      - ./backups:/app/backups
      - ./tenants:/app/tenants
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=clinic
      - POSTGRES_PASSWORD=clinic123
      - POSTGRES_DB=clinic
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
